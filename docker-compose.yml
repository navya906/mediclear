version: '3.9'

services:
  backend:
    build: ./backend
    container_name: mediclear-api
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - CORS_ALLOW_ORIGINS=http://localhost:3000
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: mediclear-web
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
